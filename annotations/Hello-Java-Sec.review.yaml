project: Hello-Java-Sec
case_overrides:
  JSL-JDBC-VUL1-VUL1:
    family: sql_injection
    rule_type: SQL Injection
    aliases_add:
    - 检测Java SQL注入漏洞
    - SQL Injection
    - 代码注入：SQL注入
    notes_add:
    - JDBC 字符串拼接场景，IRify SQL 注入告警应并入该 case。
  JSL-JDBC-SAFE2-SAFE2:
    expectation: should_warn
    expected_severity_band:
    - low
    - medium
    sanitizer_expectation: weak_guard
    family: sql_injection
    rule_type: SQL Injection
    aliases_add:
    - 检测Java SQL注入漏洞
    - SQL Injection
    - 代码注入：SQL注入
    notes_add:
    - 黑名单过滤不是强 SQL 注入防护，应按弱缓释场景评估。
  JSL-JDBC-SAFE3-WARN:
    family: sql_injection
    rule_type: SQL Injection
    aliases_add:
    - 检测Java SQL注入漏洞
    - SQL Injection
    - 代码注入：SQL注入
    notes_add:
    - ESAPI encodeForSQL 是弱缓释，SQL 注入告警应按 should_warn 评估。
  JSL-JDBC-SAFE5-SAFE5:
    family: sql_injection
    rule_type: SQL Injection
    aliases_add:
    - 检测Java SQL注入漏洞
    - SQL Injection
    - 代码注入：SQL注入
    notes_add:
    - 正则白名单过滤场景，SQL 注入规则落点并入当前 safe case。
  JSL-MYBATIS-ORDERBY-VUL-ORDER:
    family: sql_injection
    rule_type: SQL Injection
    aliases_add:
    - 检测 Java MyBatis/iBatis XML Mapper 不安全(${...})参数
    - MyBatis SQL Injection
    - SQL Injection
    - 代码注入：SQL注入：MyBatis
    - 'SQL Injection: MyBatis Mapper'
    notes_add:
    - MyBatis ${...} order by 注入场景，IRify MyBatis XML Mapper 告警应并入该 case。
    - MyBatis 控制器与 XML Mapper 根位点视为同一 SQL 注入场景。
  JSL-REDIRECT-VUL2-VUL2:
    aliases_add:
    - 检测 Java Spring Framework ModelAndView SSTI 漏洞
    - 检测Spring控制器中未调用的SSTI漏洞
    notes_add:
    - 该场景是 ModelAndView redirect，IRify 的 SSTI/template-path 派生命中并入 open redirect 主
      case。
  JSL-REDIRECT-VUL-VUL:
    aliases_add:
    - 检测Spring控制器中未调用的SSTI漏洞
    notes_add:
    - Spring redirect 字符串返回场景，IRify 的 template path 派生命中并入 open redirect 主 case。
  JSL-PROCESSIMPLVUL-VUL-VUL:
    aliases_add:
    - 检测Java反射setAccessible函数滥用漏洞
    - 输入验证：访问权限修饰符修改
    - Access Specifier Manipulation
    notes_add:
    - ProcessImpl 命令执行场景通过 setAccessible 反射调用，反射告警并入命令执行主 case。
    - setAccessible 反射访问位点属于 ProcessImpl 命令执行主场景。
  JSL-XSTREAMVUL-VUL-VUL:
    aliases_add:
    - 检测 Java XStream 不安全反序列化
    notes_add:
    - XStream fromXML 用户输入场景，IRify XStream 告警应并入该 case。
  JSL-UPLOAD-UPLOADVUL-UPLOADVUL:
    aliases_add:
    - 检测Java MultipartFile路径穿越漏洞
    - Check Java MultipartFile Path Traversal Vulnerability
    - 检测Java路径穿越漏洞
    - Path Traversal
    - 输入验证：路径遍历
    notes_add:
    - MultipartFile 文件名直接拼接保存路径的告警并入上传主场景。
  JSL-UPLOAD-SINGLEFILEUPLOADSAFE-UPLOADSAFE:
    aliases_add:
    - 检测Java MultipartFile路径穿越漏洞
    - Check Java MultipartFile Path Traversal Vulnerability
    - 检测Java路径穿越漏洞
    - Path Traversal
    - 输入验证：路径遍历
    notes_add:
    - MultipartFile 文件名直接拼接保存路径的告警并入上传主场景。
  JSL-UPLOAD-UPLOADVUL2-UPLOADVUL2:
    aliases_add:
    - 检测Java MultipartFile路径穿越漏洞
    - Check Java MultipartFile Path Traversal Vulnerability
    - 检测Java路径穿越漏洞
    - Path Traversal
    - 输入验证：路径遍历
    notes_add:
    - MultipartFile 文件名直接拼接保存路径的告警并入上传主场景。
  JSL-DESERIALIZATION-READOBJECT-READOBJECT-VUL:
    family: java_deserialization
    rule_type: Unsafe Deserialization
    title: vul：readObject 反序列化
    description: Hello-Java-Sec 中用户可控 base64 内容直接进入 ObjectInputStream.readObject。
    aliases_add:
    - 检测Java原生反序列化漏洞
    - Unsafe Deserialization
    - ObjectInputStream.readObject
    - 代码注入：不安全的反序列化
    notes_add:
    - 自动场景发现曾误归类为路径穿越，这里修正为原生反序列化。
  JSL-MYBATIS-ORDERBYSAFERE-SAFE-ORDERBYRE:
    family: sql_injection
    rule_type: SQL Injection
    aliases_add:
    - 检测 Java MyBatis/iBatis XML Mapper 不安全(${...})参数
    - MyBatis SQL Injection
    - SQL Injection
    notes_add:
    - Mapper 接口声明位点由 MyBatis orderBySafeRe 安全场景覆盖，不单列辅助位置。
  JSL-XMLDECODERVUL-VUL-VUL:
    family: java_deserialization
    rule_type: Unsafe Deserialization
    aliases_add:
    - 代码注入：XMLDecoder注入
    - 'Dynamic Code Evaluation: XMLDecoder Injection'
    - XML External Entity Injection
    notes_add:
    - XMLDecoder 反序列化主场景吸收代码卫士/Fortify 的 XMLDecoder 注入命中。
    - Fortify 将 XMLDecoder 标成 XXE 时，仍按同一危险反序列化根因归并到该 case。
  JSL-XPATHINJECTION-VUL-VUL:
    aliases_add:
    - 输入验证：缺少XML验证
    - XML External Entity Injection
    - XML Entity Expansion Injection
    notes_add:
    - XPathInjection 的危险 XML 解析命中吸收到 XPath 注入主场景。
  JSL-XPATHINJECTION-SAFE-SAFE:
    aliases_add:
    - 输入验证：缺少XML验证
    - XML External Entity Injection
    - XML Entity Expansion Injection
    notes_add:
    - XPathInjection safe 场景吸收 XML 验证类命中，用于评估 safe 误报。
  JSL-XXE-XMLREADER-XMLREADER:
    aliases_add:
    - 输入验证：缺少XML验证
    - XML External Entity Injection
    - XML Entity Expansion Injection
    notes_add:
    - XXE xmlReader 场景吸收 XML 验证/实体扩展类命中。
  HJS-CRED-APPDEV-DBPWD-VUL:
    aliases_add:
    - 密码管理：配置文件中的明文密码
    - 'Password Management: Password in Configuration File'
  HJS-CRED-APPDOCKER-DBPWD-VUL:
    aliases_add:
    - 密码管理：配置文件中的明文密码
    - 'Password Management: Password in Configuration File'
  HJS-CRED-APP-LOCAL-ADMIN-PWD-VUL:
    aliases_add:
    - 密码管理：配置文件中的明文密码
    - 'Password Management: Password in Configuration File'
  JSL-SHIROVUL-GENKEY-GENKEY:
    family: cryptographic_failure
    rule_type: Cryptographic Failures
    aliases_add:
    - 密码管理：弱加密：缺少必要加密步骤
    notes_add:
    - 未初始化 KeyGenerator 直接 generateKey，按弱加密配置场景评估。
  JSL-DESERIALIZATION-READUNSHARED-READUNSHARED-VUL:
    family: java_deserialization
    rule_type: Unsafe Deserialization
    title: vul：readUnshared 反序列化
    description: Hello-Java-Sec 中用户可控 base64 内容直接进入 ObjectInputStream.readUnshared。
    aliases_add:
    - 检测Java原生反序列化漏洞
    - Unsafe Deserialization
    - ObjectInputStream.readUnshared
    - 代码注入：不安全的反序列化
    - 'Dynamic Code Evaluation: Unsafe Deserialization'
    notes_add:
    - 自动场景发现曾误归类为路径穿越，这里修正为原生反序列化。
  JSL-XMLDECODERVUL-SAFE-SAFE:
    family: java_deserialization
    rule_type: Unsafe Deserialization
    aliases_add:
    - 代码注入：不安全的反序列化
    - 'Dynamic Code Evaluation: Unsafe Deserialization'
    notes_add:
    - XMLDecoder safe 分支读取固定本地文件，不应作为高危漏洞；若命中仅按低危噪声评估。
  JSL-XXE-SAXPARSER-SAXPARSER:
    aliases_add:
    - 输入验证：缺少XML验证
    notes_add:
    - SAXParser XXE 场景吸收代码卫士的 XML 验证缺失类命中。
  JSL-XXE-DOCUMENTBUILDER-DOCUMENTBUILDER:
    aliases_add:
    - 输入验证：缺少XML验证
    notes_add:
    - DocumentBuilder XXE 场景吸收代码卫士的 XML 验证缺失类命中。
  JSL-XSS-SAFE1-ESCAPE:
    expectation: should_warn
    expected_severity_band:
    - low
    - medium
    sanitizer_expectation: weak_guard
    family: xss
    rule_type: XSS
    aliases_add:
    - 跨站脚本：弱验证
    notes_add:
    - HtmlUtils.htmlEscape 属于输出编码防护，命中时按降级告警评估，高危应视为过报。
  HJS-CRED-DOCKER-MYSQL-ROOTPWD-VUL:
    aliases_add:
    - 密码管理：配置文件中的明文密码
    - 'Password Management: Password in Configuration File'
