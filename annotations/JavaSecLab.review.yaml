project: JavaSecLab

case_overrides:
  JSL-DELETE-VUL-VUL:
    aliases_add:
      - 检测Java路径穿越漏洞
      - Path Traversal
      - 输入验证：路径遍历
      - Path Manipulation
    notes_add:
      - 任意文件删除场景同时具备路径遍历特征，不再单独拆新 case。
  JSL-DELETE-SAFE-SAFE:
    aliases_add:
      - 检测Java路径穿越漏洞
      - Path Traversal
      - 输入验证：路径遍历
      - Path Manipulation
    notes_add:
      - 安全删除场景已覆盖路径校验逻辑，不再单独拆新 safe case。
  JSL-DIRTRAVERSAL-VUL-VUL:
    line_start: 39
    notes_add:
      - 代码卫士落点在方法签名行，向前扩一行以吸收同一目录遍历 case。
  JSL-GRAPHIC-HARDCODED-PWD-VUL:
    line_end: 175
  JSL-ACCOUNT-HARDCODED-PWD-VUL:
    line_end: 56
  JSL-BYPASS-HARDCODED-PWD-VUL:
    line_end: 87
  JSL-REVERSE-HARDCODED-PWD-VUL:
    line_end: 153
  JSL-REVERSE-HARDCODED-KEY-VUL:
    line_end: 118
    aliases_add:
      - 密码管理：硬编码加密密钥
      - "Key Management: Hardcoded Encryption Key"
  JSL-CREDENTIAL-HARDCODED-KEY-VUL:
    aliases_add:
      - 密码管理：硬编码加密密钥
      - "Key Management: Hardcoded Encryption Key"
  JSL-JDBC-ORDERBY-VUL:
    line_end: 717
  JSL-CRED-DOCKER-MYSQL-ROOTPWD-VUL:
    line_start: 9
    line_end: 10
  JSL-CRED-APPPROD-DBPWD-VUL:
    line_start: 5
    line_end: 6
  JSL-SPRINGBOOT-DEFAULT-DBPWD-VUL:
    aliases_add:
      - "Password Management: Empty Password"
  JSL-DOS-ZIPSLIP-VUL:
    line_start: 81
  JSL-CSRF-SAFE2-SAFE2:
    expectation: should_warn
    expected_severity_band:
      - low
      - medium
    sanitizer_expectation: weak_guard
    notes_add:
      - Referer 校验可伪造，属于存在防护但仍可绕过的 CSRF 场景。
  JSL-DIRTRAVERSAL-SAFE1-SAFE1:
    expectation: should_warn
    expected_severity_band:
      - low
      - medium
    sanitizer_expectation: weak_guard
    notes_add:
      - 黑名单仅拦截部分字符，未限制绝对路径或安全根目录，仍存在路径遍历风险。
  JSL-FASTJSON-SAFE-WARN:
    expectation: must_alert
    expected_severity_band:
      - high
      - critical
    sanitizer_expectation: ineffective_guard
    title: Fastjson safe 接口仍直接执行 parseObject
    description: safe 方法仅关闭 AutoType，但仍直接对用户输入执行 JSON.parseObject(content)，不应作为高危过报样例。
    notes_add:
      - 关闭 AutoType 属于弱缓释，当前仍直接 parseObject，更适合按应告警正例评估。
  JSL-LOG4J2-VUL-VUL:
    aliases_add:
      - 检测Java Log4j远程代码执行漏洞
      - Log4j RCE
      - Log4Shell
    notes_add:
      - Log4j2 漏洞场景以 logger.error(payload) 为核心 sink，IRify Log4j RCE 告警应并入该 case。
  JSL-LOG4J2-SAFE-SAFE:
    expectation: must_alert
    expected_severity_band:
      - high
      - critical
    sanitizer_expectation: ineffective_guard
    title: Log4j2 safe 接口仍可触发日志注入风险
    description: safe 方法仅调用 escapeHtml4，不能净化 Log4j JNDI/lookup payload，仍会进入 logger.error(payload)。
    aliases_add:
      - 检测Java Log4j远程代码执行漏洞
      - Log4j RCE
      - Log4Shell
    notes_add:
      - HTML 转义不是 Log4j lookup/JNDI payload 的有效消毒，不能作为 strict safe 负例。
  JSL-READOBJECT-VUL-VUL:
    family: java_deserialization
    rule_type: Unsafe Deserialization
    title: ObjectInputStream readObject 原生反序列化
    description: /readObject/vul 接口把用户 payload Base64 解码后直接交给 ObjectInputStream.readObject。
    aliases_add:
      - 检测Java原生反序列化漏洞
      - 代码注入：不安全的反序列化
      - Unsafe Deserialization
      - ObjectInputStream.readObject
    notes_add:
      - 自动场景发现曾将 ReadObject 归为路径遍历，这里修正为原生反序列化 case。
  JSL-READOBJECT-SAFE1-SAFE1:
    family: java_deserialization
    rule_type: Unsafe Deserialization
    expectation: should_warn
    expected_severity_band:
      - low
      - medium
    sanitizer_expectation: weak_guard
    title: ObjectInputStream safe1 仅关闭 commons-collections unsafe serialization
    description: safe1 仍对用户 payload 执行 ObjectInputStream.readObject，仅设置 commons-collections 属性，不属于强安全反序列化白名单。
    aliases_add:
      - 检测Java原生反序列化漏洞
      - 代码注入：不安全的反序列化
      - Unsafe Deserialization
      - ObjectInputStream.readObject
    notes_add:
      - 该场景存在弱防护，应按降级提示评估，不作为 strict safe 负例。
  JSL-REVERSE-WEAK-CRYPTO-VUL:
    aliases_add:
      - "Weak Encryption: Inadequate RSA Padding"
      - "Weak Encryption: Insecure Mode of Operation"
  JSL-LOG4J2-VUL-VUL:
    aliases_add:
      - 代码注入：JNDI查找地址注入
  JSL-OTHER-XML-UPLOAD-UNSAFE-TRANSFORMER-VUL:
    aliases_add:
      - 代码注入：XML外部实体注入
      - 代码注入：XML实体扩展注入
      - 代码注入：有风险的XML外部实体解析
      - 代码注入：有风险的XML实体扩展解析
  JSL-SSRF-VUL-VUL:
    aliases_add:
      - 代码注入：资源注入
  JSL-SSRF-SAFE-WARN:
    aliases_add:
      - 代码注入：资源注入
  JSL-URLREDIRECT-VUL1-VUL1:
    aliases_add: ["输入验证：重定向"]
  JSL-URLREDIRECT-VUL2-VUL2:
    aliases_add: ["输入验证：重定向"]
  JSL-URLREDIRECT-VUL3-VUL3:
    aliases_add: ["输入验证：重定向"]
  JSL-URLREDIRECT-VUL4-VUL4:
    aliases_add: ["输入验证：重定向"]
  JSL-URLREDIRECT-VUL5-VUL5:
    aliases_add: ["输入验证：重定向"]
  JSL-URLREDIRECT-VUL6-VUL6:
    aliases_add: ["输入验证：重定向"]
  JSL-URLREDIRECT-SAFE1-SAFE1:
    aliases_add: ["输入验证：重定向"]
  JSL-URLREDIRECT-SAFE2-WARN:
    aliases_add: ["输入验证：重定向"]

