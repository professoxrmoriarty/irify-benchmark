project_id: vuln-demo
version: 1.0.0
cases:
    - case_id: vuln-xss-001
      name: Reflected XSS via Comment Parameter
      description: User input directly rendered in HTML without encoding
      language: java
      source_code: controllers/XssController.java
      expectation:
        type: must_alert
        flow:
            source:
                symbol: content
                line: 13
                column: 46
                file: controllers/XssController.java
            sink:
                symbol: PrintWriter.write
                line: 14
                column: 12
                file: controllers/XssController.java
      metadata:
        cwe: CWE-79
        tags:
            - xss
            - reflected-xss
      notes: Reflected XSS through comment content parameter
    - case_id: vuln-xss-002
      name: Reflected XSS via Name Parameter
      description: User input directly interpolated into HTML response
      language: java
      source_code: controllers/XssController.java
      expectation:
        type: must_alert
        flow:
            source:
                symbol: name
                line: 19
                column: 43
                file: controllers/XssController.java
            sink:
                symbol: PrintWriter.write
                line: 20
                column: 12
                file: controllers/XssController.java
      metadata:
        cwe: CWE-79
        tags:
            - xss
            - reflected-xss
      notes: Reflected XSS through greet name parameter
    - case_id: vuln-pt-001
      name: Path Traversal via Filename
      description: User-controlled filename concatenated into file path without validation
      language: java
      source_code: controllers/FileController.java
      expectation:
        type: must_alert
        flow:
            source:
                symbol: filename
                line: 13
                column: 48
                file: controllers/FileController.java
            sink:
                symbol: Files.readAllBytes
                line: 15
                column: 15
                file: controllers/FileController.java
      metadata:
        cwe: CWE-22
        tags:
            - path-traversal
            - file-read
      notes: Path traversal through download filename parameter
    - case_id: vuln-pt-002
      name: Path Traversal via Absolute Path
      description: User-controlled path passed directly to File constructor
      language: java
      source_code: controllers/FileController.java
      expectation:
        type: must_alert
        flow:
            source:
                symbol: path
                line: 19
                column: 43
                file: controllers/FileController.java
            sink:
                symbol: Files.readAllBytes
                line: 20
                column: 15
                file: controllers/FileController.java
      metadata:
        cwe: CWE-22
        tags:
            - path-traversal
            - file-read
      notes: Path traversal through read path parameter
